name: Build B-Grade

on:
  workflow_dispatch:
    inputs:
      source-ref:
        description: Branch, tag, or commit in the private OFX-Building repository
        required: true
        default: main
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  BGRADE_VERSION: "0.1.9"
  RELEASE_CHANNEL: "private"
  OPENFX_COMMIT: "ab779510b2655b4d11a7e01e5c521f9aa8c88976"
  CUDA_RELEASE: "12.9.1"
  BGRADE_CUDA_ARCHITECTURES: "61;75;80;86;89;120"
  MOAZ_ER_ACCESS_PUBLIC_KEY_BASE64URL: ${{ vars.MOAZ_ER_ACCESS_PUBLIC_KEY_BASE64URL }}

jobs:
  preflight:
    name: Check configuration and create private release draft
    runs-on: ubuntu-latest
    outputs:
      release-id: ${{ steps.create-draft.outputs.release-id }}
      source-commit: ${{ steps.source.outputs.commit }}
    steps:
      - name: Require repository configuration
        shell: bash
        env:
          SOURCE_TOKEN: ${{ secrets.OFX_BUILDING_READ_TOKEN }}
          WP_USERNAME: ${{ secrets.MOAZ_ER_USERNAME }}
          WP_APPLICATION_PASSWORD: ${{ secrets.MOAZ_ER_APPLICATION_PASSWORD }}
          ACCESS_PUBLIC_KEY: ${{ vars.MOAZ_ER_ACCESS_PUBLIC_KEY_BASE64URL }}
        run: |
          missing=()
          [[ -n "$SOURCE_TOKEN" ]] || missing+=(OFX_BUILDING_READ_TOKEN)
          [[ -n "$WP_USERNAME" ]] || missing+=(MOAZ_ER_USERNAME)
          [[ -n "$WP_APPLICATION_PASSWORD" ]] || missing+=(MOAZ_ER_APPLICATION_PASSWORD)
          [[ "$ACCESS_PUBLIC_KEY" =~ ^[A-Za-z0-9_-]{43}$ ]] || missing+=(MOAZ_ER_ACCESS_PUBLIC_KEY_BASE64URL)
          if (( ${#missing[@]} )); then
            printf 'Missing or invalid GitHub Actions configuration: %s\n' "${missing[*]}" >&2
            exit 1
          fi
      - name: Check out the WordPress publisher
        uses: actions/checkout@v7
        with:
          path: publisher
      - name: Check out private B-Grade icon source
        uses: actions/checkout@v7
        with:
          repository: MoazElgabry/OFX-Building
          ref: ${{ inputs.source-ref }}
          token: ${{ secrets.OFX_BUILDING_READ_TOKEN }}
          path: ofx-building
          persist-credentials: false
      - name: Pin source commit for icon and platform builds
        id: source
        shell: bash
        run: |
          commit="$(git -C ofx-building rev-parse HEAD)"
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]] || { echo "Could not identify private source commit" >&2; exit 1; }
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - name: Verify WordPress publishing access and storage before build
        shell: bash
        env:
          INPUT_PHASE: health
          INPUT_PROJECT_SLUG: bgrade
          INPUT_VERSION: ${{ env.BGRADE_VERSION }}
          INPUT_CHANNEL: ${{ env.RELEASE_CHANNEL }}
          MOAZ_ER_USERNAME: ${{ secrets.MOAZ_ER_USERNAME }}
          MOAZ_ER_APPLICATION_PASSWORD: ${{ secrets.MOAZ_ER_APPLICATION_PASSWORD }}
        run: python3 publisher/scripts/publish_release.py

      - name: Create private WordPress draft
        id: create-draft
        env:
          INPUT_PHASE: create
          INPUT_PROJECT_SLUG: bgrade
          INPUT_VERSION: ${{ env.BGRADE_VERSION }}
          INPUT_CHANNEL: ${{ env.RELEASE_CHANNEL }}
          INPUT_PLUGIN_ICON: ofx-building/BGrade/source/src/B-Grade_Icon_640x360.png
          INPUT_DIAGNOSTICS_JSON: >-
            {"enabled":true,"logSourcePath":{"windows":"%APPDATA%\\Blackmagic Design\\DaVinci Resolve\\Support\\logs\\ResolveDebug.txt","macos":"~/Library/Logs/Blackmagic Design/DaVinci Resolve/ResolveDebug.txt"},"environment":{"BGRADE_METAL_PERF":"1"}}
          MOAZ_ER_USERNAME: ${{ secrets.MOAZ_ER_USERNAME }}
          MOAZ_ER_APPLICATION_PASSWORD: ${{ secrets.MOAZ_ER_APPLICATION_PASSWORD }}
        run: python3 publisher/scripts/publish_release.py

  build-windows:
    name: Windows CUDA build
    runs-on: windows-2022
    needs: preflight
    outputs:
      source-commit: ${{ steps.source.outputs.commit }}
    defaults:
      run:
        shell: powershell
        working-directory: ofx-building/BGrade/source
    steps:
      - name: Checkout private OFX source
        uses: actions/checkout@v7
        with:
          repository: MoazElgabry/OFX-Building
          ref: ${{ needs.preflight.outputs.source-commit }}
          token: ${{ secrets.OFX_BUILDING_READ_TOKEN }}
          path: ofx-building
          persist-credentials: false
      - name: Check out the WordPress publisher
        uses: actions/checkout@v7
        with:
          path: publisher
      - name: Record private source commit
        id: source
        run: |
          $commit = (git -C "../.." rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $commit -notmatch '^[0-9a-f]{40}$') { throw "Could not identify private source commit" }
          "commit=$commit" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Verify public key and B-Grade version
        run: |
          if ($env:MOAZ_ER_ACCESS_PUBLIC_KEY_BASE64URL -notmatch '^[A-Za-z0-9_-]{43}$') { throw "The public receipt-verification key variable is missing or malformed" }
          if (!(Select-String -Path CMakeLists.txt -Pattern 'project\(BGrade VERSION 0\.1\.9')) { throw "Private source is not B-Grade 0.1.9" }
      - name: Clone and verify pinned OpenFX SDK
        run: |
          $sdk = "../../Chromonotgen/source/ofx-sdk"
          if (!(Test-Path (Join-Path $sdk "include\ofxImageEffect.h"))) {
            New-Item -ItemType Directory -Force -Path (Split-Path $sdk) | Out-Null
            git clone --filter=blob:none https://github.com/AcademySoftwareFoundation/openfx.git $sdk
            if ($LASTEXITCODE -ne 0) { throw "Could not clone the OpenFX SDK" }
            git -C $sdk fetch --depth 1 origin $env:OPENFX_COMMIT
            if ($LASTEXITCODE -ne 0) { throw "Could not fetch the pinned OpenFX SDK commit" }
            git -C $sdk checkout --detach $env:OPENFX_COMMIT
            if ($LASTEXITCODE -ne 0) { throw "Could not check out the pinned OpenFX SDK commit" }
          }
          $sdkCommit = (git -C $sdk rev-parse HEAD).Trim()
          if ($sdkCommit -ne $env:OPENFX_COMMIT) { throw "OpenFX SDK commit mismatch: $sdkCommit" }
          if (!(Test-Path (Join-Path $sdk "include\ofxImageEffect.h"))) { throw "Pinned OpenFX SDK headers are missing" }
      - name: Install pinned CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: ${{ env.CUDA_RELEASE }}
          method: local
      - name: Verify CUDA toolkit and configure toolchain
        run: |
          $nvccOutput = (& nvcc --version 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0 -or $nvccOutput -notmatch "release 12\.9") { throw "Expected CUDA 12.9.x, got: $nvccOutput" }
          if ([string]::IsNullOrWhiteSpace($env:CUDA_PATH) -or !(Test-Path (Join-Path $env:CUDA_PATH "bin\nvcc.exe"))) { throw "CUDA_PATH is not usable" }
          $env:BGRADE_CUDA_ARCHITECTURES = "61;75;80;86;89;120"
          & .\build_cuda_vc.bat
          if ($LASTEXITCODE -ne 0) { throw "B-Grade CUDA build or configured tests failed" }
          # GitHub-hosted Windows runners have no compatible NVIDIA driver; keep
          # CUDA compilation covered, but omit the runtime smoke test that needs a GPU.
          ctest --test-dir build-cuda --output-on-failure -E "^BGradeCudaSmokeTests$"
          if ($LASTEXITCODE -ne 0) { throw "B-Grade Windows tests failed" }
      - name: Validate and package Windows bundle
        run: |
          $bundle = Join-Path (Get-Location) "bundle-cuda\BGrade.ofx.bundle"
          $binary = Join-Path $bundle "Contents\Win64\BGrade.ofx"
          if (!(Test-Path $binary)) { throw "Windows B-Grade bundle is missing its plugin binary: $binary" }
          # Windows bundles do not contain Info.plist; verify identity/version
          # against the checked-out CMake project instead.
          if (!(Select-String -Path CMakeLists.txt -Pattern 'set\(PLUGIN_IDENTIFIER "com\.moazelgabry\.bgrade"\)' -Quiet)) { throw "Unexpected B-Grade bundle identifier" }
          if (!(Select-String -Path CMakeLists.txt -Pattern 'project\(BGrade VERSION 0\.1\.9' -Quiet)) { throw "Unexpected B-Grade bundle version" }
          $zip = "BGrade_v0.1.9_windows_x86_64_portable.zip"
          if (Test-Path $zip) { Remove-Item -LiteralPath $zip -Force }
          Compress-Archive -Path $bundle -DestinationPath $zip -CompressionLevel Optimal
          if (!(Test-Path $zip) -or (Get-Item $zip).Length -le 0) { throw "Windows package is empty" }
      - name: Upload Windows package directly to WordPress draft
        env:
          INPUT_PHASE: upload
          INPUT_PROJECT_SLUG: bgrade
          INPUT_VERSION: ${{ env.BGRADE_VERSION }}
          INPUT_RELEASE_ID: ${{ needs.preflight.outputs.release-id }}
          INPUT_ARTIFACTS: '[{"platform":"windows","architecture":"x86_64","path":"BGrade_v0.1.9_windows_x86_64_portable.zip"}]'
          MOAZ_ER_USERNAME: ${{ secrets.MOAZ_ER_USERNAME }}
          MOAZ_ER_APPLICATION_PASSWORD: ${{ secrets.MOAZ_ER_APPLICATION_PASSWORD }}
        run: python "$env:GITHUB_WORKSPACE/publisher/scripts/publish_release.py"

  build-macos:
    name: macOS universal Metal build
    runs-on: macos-14
    needs: preflight
    outputs:
      source-commit: ${{ steps.source.outputs.commit }}
    defaults:
      run:
        shell: bash
        working-directory: ofx-building/BGrade/source
    steps:
      - name: Checkout private OFX source
        uses: actions/checkout@v7
        with:
          repository: MoazElgabry/OFX-Building
          ref: ${{ needs.preflight.outputs.source-commit }}
          token: ${{ secrets.OFX_BUILDING_READ_TOKEN }}
          path: ofx-building
          persist-credentials: false
      - name: Check out the WordPress publisher
        uses: actions/checkout@v7
        with:
          path: publisher
      - name: Record private source commit
        id: source
        run: |
          commit="$(git -C ../.. rev-parse HEAD)"
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]] || { echo "Could not identify private source commit" >&2; exit 1; }
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - name: Verify public key and B-Grade version
        run: |
          [[ "$MOAZ_ER_ACCESS_PUBLIC_KEY_BASE64URL" =~ ^[A-Za-z0-9_-]{43}$ ]] || { echo "The public receipt-verification key variable is missing or malformed" >&2; exit 1; }
          grep -Eq 'project\(BGrade VERSION 0\.1\.9' CMakeLists.txt || { echo "Private source is not B-Grade 0.1.9" >&2; exit 1; }
      - name: Clone and verify pinned OpenFX SDK
        run: |
          sdk="../../Chromonotgen/source/ofx-sdk"
          if [ ! -f "$sdk/include/ofxImageEffect.h" ]; then
            mkdir -p "$(dirname "$sdk")"
            git clone --filter=blob:none https://github.com/AcademySoftwareFoundation/openfx.git "$sdk"
            git -C "$sdk" fetch --depth 1 origin "$OPENFX_COMMIT"
            git -C "$sdk" checkout --detach "$OPENFX_COMMIT"
          fi
          sdk_commit="$(git -C "$sdk" rev-parse HEAD)"
          [[ "$sdk_commit" == "$OPENFX_COMMIT" ]] || { echo "OpenFX SDK commit mismatch: $sdk_commit" >&2; exit 1; }
          test -f "$sdk/include/ofxImageEffect.h" || { echo "Pinned OpenFX SDK headers are missing" >&2; exit 1; }
      - name: Install Rust targets for universal receipt verifier
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Build universal macOS bundle
        run: |
          bash ./build_macos_universal.sh build-macos-universal
          ctest --test-dir build-macos-universal --output-on-failure
      - name: Validate and package macOS bundle
        run: |
          bundle="bundle-macos-universal/BGrade.ofx.bundle"
          binary="${bundle}/Contents/MacOS/BGrade.ofx"
          info="${bundle}/Contents/Info.plist"
          test -f "$binary" && test -f "$info" || { echo "macOS B-Grade bundle is incomplete" >&2; exit 1; }
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$info" | grep -Fx 'com.moazelgabry.bgrade'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$info" | grep -Fx '0.1.9'
          arches="$(lipo -archs "$binary")"
          [[ " $arches " == *" x86_64 "* && " $arches " == *" arm64 "* ]] || { echo "macOS bundle is not universal: $arches" >&2; exit 1; }
          zip="BGrade_v0.1.9_macos_universal_portable.zip"
          rm -f "$zip"
          ditto -c -k --sequesterRsrc --keepParent "$bundle" "$zip"
          test -s "$zip"
      - name: Upload macOS package directly to WordPress draft
        env:
          INPUT_PHASE: upload
          INPUT_PROJECT_SLUG: bgrade
          INPUT_VERSION: ${{ env.BGRADE_VERSION }}
          INPUT_RELEASE_ID: ${{ needs.preflight.outputs.release-id }}
          INPUT_ARTIFACTS: '[{"platform":"macos","architecture":"universal","path":"BGrade_v0.1.9_macos_universal_portable.zip"}]'
          MOAZ_ER_USERNAME: ${{ secrets.MOAZ_ER_USERNAME }}
          MOAZ_ER_APPLICATION_PASSWORD: ${{ secrets.MOAZ_ER_APPLICATION_PASSWORD }}
        run: python3 "$GITHUB_WORKSPACE/publisher/scripts/publish_release.py"

  complete-wordpress-draft:
    name: Complete private WordPress draft
    runs-on: ubuntu-latest
    needs: [preflight, build-windows, build-macos]
    if: always() && needs.preflight.result == 'success' && needs.build-windows.result == 'success' && needs.build-macos.result == 'success'
    steps:
      - name: Check out the WordPress publisher
        uses: actions/checkout@v7
        with:
          path: publisher
      - name: Complete WordPress draft after both direct uploads
        env:
          INPUT_PHASE: complete
          INPUT_PROJECT_SLUG: bgrade
          INPUT_RELEASE_ID: ${{ needs.preflight.outputs.release-id }}
          INPUT_SOURCE_COMMIT: ${{ needs.build-windows.outputs.source-commit || needs.build-macos.outputs.source-commit }}
          INPUT_SOURCE_RUN: ${{ github.run_id }}
          MOAZ_ER_USERNAME: ${{ secrets.MOAZ_ER_USERNAME }}
          MOAZ_ER_APPLICATION_PASSWORD: ${{ secrets.MOAZ_ER_APPLICATION_PASSWORD }}
        run: python3 publisher/scripts/publish_release.py
